name: CI
on:
  push:
  pull_request:
jobs:
  local-ci:
    name: Local CI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: AtomiCloud/actions.setup-nix@v3
        with:
          namespacelabs: 'false'
      - run: nix develop .#ci -c bun install --frozen-lockfile
      - run: nix develop .#ci -c bun run ci:local
